name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'

      - name: Allow the private Microapps ID module
        env:
          IDENTITY_READ_TOKEN: ${{ secrets.IDENTITY_READ_TOKEN }}
        run: |
          echo "GOPRIVATE=github.com/olegpustovit/identity" >> "$GITHUB_ENV"
          git config --global url."https://x-access-token:${IDENTITY_READ_TOKEN}@github.com/".insteadOf "https://github.com/"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build and test React UI
        run: cd web && npm ci && npm test && npm run build

      - name: Install browser
        run: cd web && npx playwright install --with-deps chromium

      - name: Verify browser workflows and large mailbox budgets
        run: cd web && npm run test:browser && npm run test:performance

      - name: Build hosted server
        run: go build ./cmd/mail

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        env:
          MAIL_TEST_POSTGRES_URI: postgres://postgres:postgres@127.0.0.1:55432/postgres
        run: go test -race -v ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'

      - name: Allow the private Microapps ID module
        env:
          IDENTITY_READ_TOKEN: ${{ secrets.IDENTITY_READ_TOKEN }}
        run: |
          echo "GOPRIVATE=github.com/olegpustovit/identity" >> "$GITHUB_ENV"
          git config --global url."https://x-access-token:${IDENTITY_READ_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8

  vuln:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'

      - name: Allow the private Microapps ID module
        env:
          IDENTITY_READ_TOKEN: ${{ secrets.IDENTITY_READ_TOKEN }}
        run: |
          echo "GOPRIVATE=github.com/olegpustovit/identity" >> "$GITHUB_ENV"
          git config --global url."https://x-access-token:${IDENTITY_READ_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...
